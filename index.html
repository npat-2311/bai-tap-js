<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập JS Buổi 2-3</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    
    <h1>TÍNH TIỀN LƯƠNG NHÂN VIÊN</h1>
    <p>Lương 1 ngày : 100.000đ</p>
    <input id="soNgay" type="number" class="border-2" placeholder="Nhập số ngày..">
    <button id="tinhLuong" class="bg-blue-500 rounded-4xl px-2 hover:text-white cursor-pointer">Tính lương</button>
    <p id="tienLuong"></p>

    <hr class="border-5 bg-gray-500 my-5">

    <h1>TÍNH GIÁ TRỊ TRUNG BÌNH</h1>
    <input id="soMot" type="number" class="border-2" placeholder="Nhập số thứ nhất...">
    <input id="soHai" type="number" class="border-2" placeholder="Nhập số thứ hai...">
    <input id="soBa" type="number" class="border-2" placeholder="Nhập số thứ ba...">
    <input id="soBon" type="number" class="border-2" placeholder="Nhập số thứ bốn...">
    <input id="soNam" type="number" class="border-2" placeholder="Nhập số thứ năm...">
    <button id="tinhTrungBinh" class="bg-blue-500 rounded-4xl px-2 hover:text-white cursor-pointer">Tính Trung Bình</button>
    <p id="inTrungBinh"></p>

    <hr class="border-5 bg-gray-500 my-5">

    <h1>ĐỔI USD SANG VNĐ</h1>
    <p>Giá 1 USD = 23.500 VNĐ</p>
    <input id="tienUsd" type="number" class="border-2" placeholder="Nhập số USD cần đổi...">
    <button id="doiTien" class="bg-blue-500 rounded-4xl px-2 hover:text-white cursor-pointer">Quy Đổi</button>
    <p id="soVnd"></p>

    <hr class="border-5 bg-gray-500 my-5">

    <input id="chieuDai" type="number" class="border-2" placeholder="Nhập chiều dài chữ nhật...">
    <input id="chieuRong" type="number" class="border-2" placeholder="Nhập chiều rộng chữ nhật...">

    <button id="tinhChuNhat" class="bg-blue-500 rounded-4xl px-2 hover:text-white cursor-pointer">Tính S và P</button>
    <p id="inChuVi"></p>
    <p id="inDienTich"></p>

    <hr class="border-5 bg-gray-500 my-5">

    <input id="number2ky" type="number" class="border-2" placeholder="Nhập chiều dài chữ nhật...">

    <button id="btnSum2ky" class="bg-blue-500 rounded-4xl px-2 hover:text-white cursor-pointer">Tính tổng</button>

    <p id="pSum2ky"></p>


<script src="./main.js"></script>
</body>
</html>
